<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор игры</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            width: 100%;
            max-width: 720px;
            padding: clamp(20px, 5vw, 40px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: clamp(1.3em, 4vw, 1.9em);
            word-break: break-word;
        }
        .buttons {
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
        }

        /* ---------- Base button look ---------- */
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
        }

        /*
            Game buttons pick their own colors from CSS variables that are
            injected by JS (see GAMES below). This means there is NO need to
            write a separate .btn-xxx CSS rule for every new game.
        */
        .buttons button {
            flex: 1 1 200px;
            min-width: 0;
            background: var(--btn-color, #888);
        }

        /* Hover / tap feedback only on devices that actually hover (avoids
           "stuck hover" on touch screens). */
        @media (hover: hover) {
            .buttons button:hover {
                background: var(--btn-hover, var(--btn-color, #666));
                transform: scale(1.05);
                box-shadow: 0 5px 20px var(--btn-glow, rgba(0,0,0,0.5));
            }
        }

        /* ---------- Steam widget (kept responsive) ---------- */
        .steam-widget {
            width: 100%;
            max-width: 646px;
            margin: 0 auto;
        }
        .steam-widget iframe {
            display: block;
            width: 100%;
            max-width: 100%;
            height: 190px;
            border: 0;
        }
        .box-2 {
            margin-top: 14px;
            word-break: break-word;
        }

        /* ---------- Floating "i" (info) button ---------- */
        .info-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 46px;
            height: 46px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            color: #000;
            border: 2px solid rgba(0, 0, 0, 0.85);
            font-size: 22px;
            font-weight: bold;
            font-style: italic;
            font-family: Georgia, 'Times New Roman', serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .info-button:hover {
            background: #ffffff;
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        /* ---------- README modal ---------- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 16px;
            max-width: 820px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            padding: clamp(18px, 5vw, 40px);
            box-sizing: border-box;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            width: auto;
            padding: 4px 12px;
            background: transparent;
            border: none;
            font-size: 30px;
            line-height: 1;
            color: #999;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #333;
            transform: none;
            box-shadow: none;
        }

        /* Language toggle (RU/EN) — hidden by default, visible only in
           Vuplex mode via the body.vuplex-mode rule below. */
        .modal-lang {
            display: none;
            position: absolute;
            top: 8px;
            left: 12px;
            width: auto;
            padding: 4px 10px;
            background: transparent;
            border: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        }
        .modal-lang:hover {
            transform: none;
            box-shadow: none;
        }
        body.vuplex-mode .modal-lang {
            display: inline-block;
        }

        /* ---------- Rendered README styling ---------- */
        .readme {
            text-align: left;
            line-height: 1.6;
            color: #333;
        }
        .readme h1, .readme h2, .readme h3 {
            color: #333;
            margin-top: 1.2em;
        }
        .readme h1 { font-size: 1.8em; }
        .readme h3 { font-size: 1.2em; }
        .readme a {
            color: #667eea;
            word-break: break-word;
        }
        .readme img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .readme blockquote {
            border-left: 4px solid #667eea;
            margin: 12px 0;
            padding: 8px 16px;
            background: #f5f5fa;
            color: #555;
        }
        .readme code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
        }

        /* ============================================================
           MOBILE ADAPTATION (phones)
           - On phones only the games marked mobile:true stay visible.
           - Buttons become full-width, comfortable to tap.
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px;
                justify-content: flex-start;
            }
            .container {
                padding: 22px 16px;
            }
            h1 {
                margin-bottom: 18px;
            }
            /* Hide every game that is NOT phone-friendly */
            .buttons button[data-mobile="false"] {
                display: none;
            }
            .buttons {
                gap: 12px;
            }
            .buttons button {
                flex: 1 1 100%;
                width: 100%;
                padding: 16px 20px;
                font-size: 17px;
            }
        }

        /* ============================================================
           VUPLEX MODE (страница открыта внутри Vuplex 3D WebView)
           - Игры с isVuplexSupported: false скрываются.
           - Промо-блоки (Steam, itch.io, контакты разработчика)
             тоже скрываются.
           ============================================================ */
        body.vuplex-mode .buttons button[data-vuplex="false"] {
            display: none;
        }
        body.vuplex-mode .promo-block {
            display: none !important;
        }

        /* ============================================================
           ЛИДЕРБОРД (активен ТОЛЬКО в режиме Vuplex)
           - .leaderboard-entry — кнопка-вход в нижнем блоке: в обычном
             режиме полностью скрыта (display:none), в vuplex-режиме
             показывается вместо скрытых промо-блоков и открывает оверлей;
           - #leaderboardModal — модальное окно с таблицами победителей,
             переиспользует стили .modal / .modal-content от README.
           ============================================================ */
        .leaderboard-entry {
            display: none;
        }
        body.vuplex-mode .leaderboard-entry {
            display: block;
            margin-top: 6px;
            padding: 14px 12px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.3s ease;
        }
        @media (hover: hover) {
            body.vuplex-mode .leaderboard-entry:hover {
                background: #f5f5fa;
                transform: scale(1.03);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            }
        }

        .leaderboard-content {
            max-width: 560px;
        }
        .leaderboard-title {
            margin: 0 0 4px;
            font-size: clamp(1.2em, 4vw, 1.5em);
            color: #333;
            word-break: break-word;
        }
        .leaderboard-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 14px 0 18px;
        }
        .leaderboard-tabs button {
            padding: 8px 16px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            background: #ececf4;
            color: #555;
            cursor: pointer;
        }
        .leaderboard-tabs button:hover {
            background: #dcdcf0;
            transform: none;
            box-shadow: none;
        }
        .leaderboard-tabs button.lb-active {
            background: #667eea;
            color: #fff;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }
        .leaderboard-table th,
        .leaderboard-table td {
            padding: 8px 12px;
            font-size: 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .leaderboard-table th {
            background: #f5f5fa;
            color: #333;
        }
        .leaderboard-table tr:last-child td {
            border-bottom: none;
        }
        .leaderboard-table .lb-empty td {
            color: #999;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Floating info button -->
    <button class="info-button" onclick="openReadme()" title="Инфо / README">i</button>

    <!-- README modal -->
    <div class="modal" id="readmeModal" onclick="if(event.target===this) closeReadme()">
        <div class="modal-content">
            <button class="modal-lang" id="readmeLangToggle" onclick="toggleReadmeLang()" title="Сменить язык / Switch language">🔣</button>
            <button class="modal-close" onclick="closeReadme()" title="Закрыть">&times;</button>
            <div class="readme" id="readmeContent">
                <p>Загрузка…</p>
            </div>
        </div>
    </div>

    <!-- Leaderboard modal (только для Vuplex-режима; паттерн README-модалки) -->
    <div class="modal" id="leaderboardModal" onclick="if(event.target===this) closeLeaderboard()">
        <div class="modal-content leaderboard-content">
            <button class="modal-close" onclick="closeLeaderboard()" title="Закрыть">&times;</button>
            <h2 class="leaderboard-title">🏆Лидерборд/leaderboard🏆</h2>
            <div class="leaderboard-tabs" id="leaderboardTabs"></div>
            <div class="leaderboard-tables" id="leaderboardTables"></div>
        </div>
    </div>

    <div class="container">
        <h1>Select a game/Выберите игру</h1>

        <!-- Game buttons are generated automatically from the GAMES list below -->
        <div class="buttons" id="gameButtons"></div>

        <br/><br/>
        <div class="container" id="bottomSection">
            <div class="box-1 steam-widget promo-block">
                <iframe src="https://store.steampowered.com/widget/4799230/?t=please%20add%20my%20game%20to%20your%20wishlist%20%F0%9F%98%8D%E2%AD%90%20thank%20you!" frameborder="0" loading="lazy"></iframe>
            </div>
            <div class="promo-block">
                <iframe frameborder="0" src="https://itch.io/embed/4940583?bg_color=000000&amp;fg_color=ffa5a5&amp;border_color=ca0000" width="552" height="167"><a href="https://velikiy-prikalel.itch.io/fetidity">FETIDITY by Velikiy Prikalel</a></iframe>
            </div>
            <div class="box-2 promo-block"><a style="color: #333;">contact with developer:</a> <a href="mailto:jispar@mail.ru">jispar@mail.ru</a>.</div>

            <!-- Вход в лидерборд: виден и кликабелен только в vuplex-режиме
                 (правило body.vuplex-mode .leaderboard-entry в CSS выше);
                 в обычном режиме элемент полностью скрыт. -->
            <div class="leaderboard-entry" id="leaderboardEntry" onclick="openLeaderboard()" title="Открыть лидерборд / Open leaderboard">🏆Лидерборд/leaderboard🏆</div>
        </div>
    </div>

    <!-- Markdown renderer + README loader -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        /* ============================================================
           СПИСОК ИГР  (единственное место, которое нужно править)
           ------------------------------------------------------------
           Чтобы добавить новую игру — просто скопируйте один блок { ... }
           и заполните поля. Больше НИЧЕГО менять не нужно: кнопка,
           цвет и логика мобильной видимости подхватятся автоматически.

             cls    — класс-«крючок» (на случай, если захотите стилизовать
                      конкретную игру вручную). Можно оставить ''.
             label  — текст кнопки (с эмодзи).
             href   — ссылка на игру.
             color  — основной цвет кнопки.
             hover  — цвет при наведении (необязательно).
             glow   — цвет свечения при наведении (необязательно).
             mobile — true  → показывать на телефоне;
                      false → скрыть на телефоне (по умолчанию).
             isVuplexSupported — поддержка запуска внутри Vuplex 3D WebView;
                      true  → (по умолчанию) игра доступна в режиме Vuplex;
                      false → кнопка скрывается, когда страница открыта в Vuplex.
            ============================================================ */
        const GAMES = [
            {
                cls: 'btn-domino',
                label: '🎲 Domino Ladder',
                href: './domino-ladder-index.html',
                color: '#f093fb',
                hover: '#e07cee',
                glow: 'rgba(240, 147, 251, 0.5)',
                mobile: false,
                isVuplexSupported: true,
            },
            {
                cls: 'btn-password',
                label: '🔐 Password Game',
                href: './password-game-index.html',
                color: '#4facfe',
                hover: '#3a8fd6',
                glow: 'rgba(79, 172, 254, 0.5)',
                mobile: false,
                isVuplexSupported: true,
            },
            {
                cls: 'btn-mutagen',
                label: '🔁 Mutagen',
                href: './mutation-game/index.html',
                color: '#0330fc',
                hover: '#001675',
                glow: 'rgba(135, 157, 255, 0.5)',
                mobile: true,
                isVuplexSupported: true,
            },
            {
                cls: 'btn-shittymaze',
                label: '🏠 ShittyMaze',
                href: 'https://prikalel.gitlab.io/shittymaze-build/',
                color: '#cc7a00',
                hover: '#915700',
                glow: 'rgba(0, 0, 0, 0.5)',
                mobile: false,
                isVuplexSupported: false,
            },
            {
                cls: 'btn-theygrow',
                label: '👤 Theygrow',
                href: 'https://prikalel.github.io/they-grow/',
                color: '#7a32ff',
                hover: '#2d0081',
                glow: 'rgba(0, 0, 0, 0.5)',
                mobile: false,
                isVuplexSupported: true,
            },
            {
                cls: 'degustator',
                label: '🍔 Degustator',
                href: 'https://prikalel.github.io/degustator-on-x-7/',
                color: '#2a9400',
                hover: '#1a3f00',
                glow: 'rgba(179, 255, 47, 0.5)',
                mobile: true,
                isVuplexSupported: true,
            },
            {
                cls: 'aang',
                label: '🔥 AangLegend',
                href: 'https://prikalel.github.io/AangLegend/',
                color: '#bd0d00',
                hover: '#570600',
                glow: 'rgba(255, 143, 135, 0.5)',
                mobile: true,
                isVuplexSupported: true,
            },
            {
                cls: 'truba',
                label: '🚰 TRUBA',
                href: 'https://prikalel.gitlab.io/truba-build/',
                color: '#211715',
                hover: '#000000',
                glow: 'rgba(61, 10, 10, 0.5)',
                mobile: false,
                isVuplexSupported: false,
            },
            {
                cls: 'baba-yaga',
                label: '🧹 JUST GET IN',
                href: 'https://prikalel.gitlab.io/baba-yaga-build/',
                color: '#aaf542',
                hover: '#4c8200',
                glow: 'rgba(249, 255, 82, 0.5)',
                mobile: false,
                isVuplexSupported: true,
            },
            {
                cls: 'rooster-fiht',
                label: '🐓 Rooster Fight',
                href: 'https://prikalel.github.io/RoosterFight2/RoosterFight.html',
                color: '#797d00',
                hover: '#baac2f',
                glow: 'rgba(68, 69, 47, 0.5)',
                mobile: false,
                isVuplexSupported: true,
            },
        ];

        /* Build the game buttons from the config above. */
        function renderGames() {
            const container = document.getElementById('gameButtons');
            if (!container) return;

            const frag = document.createDocumentFragment();
            GAMES.forEach(function (g) {
                const btn = document.createElement('button');
                if (g.cls) btn.className = g.cls;

                // Colors are injected as CSS variables -> no per-game CSS needed.
                btn.style.setProperty('--btn-color', g.color);
                btn.style.setProperty('--btn-hover', g.hover || g.color);
                btn.style.setProperty('--btn-glow', g.glow || 'rgba(0, 0, 0, 0.5)');

                // Phone-visibility flag drives the @media rule in <style>.
                btn.dataset.mobile = g.mobile ? 'true' : 'false';

                // Vuplex-support flag: hidden in Vuplex mode via body.vuplex-mode CSS.
                btn.dataset.vuplex = (g.isVuplexSupported === false) ? 'false' : 'true';

                btn.textContent = g.label;
                btn.addEventListener('click', function () {
                    window.location.href = g.href;
                });
                frag.appendChild(btn);
            });
            container.appendChild(frag);
        }

        renderGames();

        /* ---------- Определение Vuplex 3D WebView ----------
           window.vuplex добавляется Vuplex в страницу; в обычном браузере
           его нет (undefined). Проверяем именно наличие объекта, а не
           window.vuplex === null. Объект может появиться позже старта
           загрузки страницы, поэтому дополнительно слушаем vuplexready. */
        function inVuplex() {
            return typeof window.vuplex !== 'undefined' && window.vuplex !== null;
        }

        function applyVuplexMode() {
            if (inVuplex()) {
                document.body.classList.add('vuplex-mode');
            }
        }

        /* ============================================================
           ДЕБАГ-ИМИТАЦИЯ VUPLEX (только для отладки в обычном браузере)
           ------------------------------------------------------------
           Дебаг: reloadAsVuplex() в консоли — перезагрузить страницу в
           режиме-имитации vuplex; повторный вызов вернёт обычный режим
           (переключатель). Мок ставится ДО вызова applyVuplexMode() ниже,
           чтобы inVuplex() его увидел и включился vuplex-режим. Дополнительно
           доступен window.mockVuplexLeaderboards({...} или 'json-строка') —
           «прислать» лидерборды из Unity, не выходя из браузера.
           В реальном Vuplex и при обычном просмотре (флаг не установлен)
           этот блок не делает НИЧЕГО.
           ============================================================ */
        (function installVuplexDebugMock() {
            const FLAG = 'vuplexDebug';
            function debugFlagSet() {
                try { return localStorage.getItem(FLAG) === '1'; } catch (e) { return false; }
            }

            // Переключатель: 1-й вызов включает имитацию, 2-й — выключает.
            window.reloadAsVuplex = function () {
                try {
                    if (localStorage.getItem(FLAG) === '1') localStorage.removeItem(FLAG);
                    else localStorage.setItem(FLAG, '1');
                } catch (e) {
                    console.warn('[vuplex-mock] localStorage недоступен:', e);
                    return;
                }
                location.reload();
            };

            // Реальный Vuplex уже есть или флаг не установлен — мок не нужен.
            if (window.vuplex || !debugFlagSet()) return;

            const handlers = {};   // type -> [callbacks]
            window.vuplex = {
                postMessage: function (msg) {
                    console.log('[vuplex-mock] postMessage:', msg);
                },
                addEventListener: function (type, cb) {
                    if (typeof cb !== 'function') return;
                    (handlers[type] = handlers[type] || []).push(cb);
                },
                removeEventListener: function (type, cb) {
                    if (!handlers[type]) return;
                    handlers[type] = handlers[type].filter(function (h) { return h !== cb; });
                }
            };

            // Хелпер: вызывает сохранённые обработчики "message" так же,
            // как это сделал бы настоящий Vuplex ({ data: '<json-строка>' }).
            window.mockVuplexLeaderboards = function (dataOrJson) {
                const listeners = handlers['message'] || [];
                if (!listeners.length) {
                    console.warn('[vuplex-mock] Нет подписчиков события "message".');
                    return;
                }
                const payload = (typeof dataOrJson === 'string') ? dataOrJson : JSON.stringify(dataOrJson);
                listeners.forEach(function (cb) { cb({ data: payload }); });
            };

            console.log('[vuplex-mock] Активен. reloadAsVuplex() — обычный режим; ' +
                'mockVuplexLeaderboards(...) — тест лидербордов.');
        })();

        applyVuplexMode();
        window.addEventListener('vuplexready', applyVuplexMode, { once: true });

        /* ============================================================
           ЛИДЕРБОРД (активен только в режиме Vuplex)
           ------------------------------------------------------------
           Данные приходят из Unity одним сообщением по шине vuplex:
           { "leaderboards": { "password": { "count": 5, "users": [
               { "high_score": 123, "user_name": "Вова пупкин" } ] }, ... } }
           Ожидаемые ключи игр: password, mutagen, theygrow, aanglegend,
           roosterfight (ключи чистим от пробелов, неизвестные игнорируем).
           ============================================================ */
        const LEADERBOARD_GAMES = ['password', 'mutagen', 'theygrow', 'aanglegend', 'roosterfight'];
        const LEADERBOARD_DATA = {};            // game id -> массив { high_score, user_name }
        let activeLeaderboardGame = 'password'; // активная вкладка (по умолчанию password)
        let leaderboardBuilt = false;           // вкладки/таблицы строятся при первом открытии

        function openLeaderboard() {
            if (!inVuplex()) return;            // строго только vuplex-режим
            ensureLeaderboardBuilt();
            // Прячем список игр и нижний блок — closeLeaderboard() вернёт их на место.
            document.getElementById('gameButtons').style.display = 'none';
            document.getElementById('bottomSection').style.display = 'none';
            document.getElementById('leaderboardModal').classList.add('open');
        }

        function closeLeaderboard() {
            const modal = document.getElementById('leaderboardModal');
            if (!modal.classList.contains('open')) return;   // не открыт — нечего восстанавливать
            modal.classList.remove('open');
            document.getElementById('gameButtons').style.display = '';
            document.getElementById('bottomSection').style.display = '';
        }

        /* Разовая сборка вкладок и таблиц — при первом открытии оверлея. */
        function ensureLeaderboardBuilt() {
            if (leaderboardBuilt) return;
            leaderboardBuilt = true;
            const tabs = document.getElementById('leaderboardTabs');
            const holder = document.getElementById('leaderboardTables');
            LEADERBOARD_GAMES.forEach(function (id, i) {
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'lb-tab' + (i === 0 ? ' lb-active' : '');
                tab.dataset.game = id;
                tab.textContent = id;                     // password / mutagen / ...
                tab.addEventListener('click', function () { activateLeaderboardTab(id); });
                tabs.appendChild(tab);

                const table = document.createElement('table');
                table.className = 'leaderboard-table';
                table.id = 'lb-table-' + id;
                if (i !== 0) table.style.display = 'none'; // видна только активная
                const head = document.createElement('thead');
                head.innerHTML = '<tr><th>#</th><th>⭐</th><th>name</th></tr>';
                table.appendChild(head);
                table.appendChild(document.createElement('tbody'));
                holder.appendChild(table);
                renderLeaderboardRows(id);
            });
        }

        function activateLeaderboardTab(id) {
            activeLeaderboardGame = id;
            const tabs = document.querySelectorAll('#leaderboardTabs .lb-tab');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.toggle('lb-active', tabs[i].dataset.game === id);
            }
            LEADERBOARD_GAMES.forEach(function (game) {
                const table = document.getElementById('lb-table-' + game);
                if (table) table.style.display = (game === id) ? '' : 'none';
            });
        }

        /* Заполнение таблицы игры id: пересортировка по убыванию очков,
           при отсутствии данных — одна приглушённая строка-заглушка. */
        function renderLeaderboardRows(id) {
            const table = document.getElementById('lb-table-' + id);
            if (!table) return;
            const tbody = table.tBodies[0];
            tbody.textContent = '';
            // Вход может быть неотсортированным — сортируем сами (по убыванию).
            const rows = (LEADERBOARD_DATA[id] || []).slice().sort(function (a, b) {
                return (Number(b.high_score) || 0) - (Number(a.high_score) || 0);
            });
            if (!rows.length) {
                const emptyRow = document.createElement('tr');
                emptyRow.className = 'lb-empty';
                const emptyCell = document.createElement('td');
                emptyCell.colSpan = 3;
                emptyCell.textContent = '— нет данных / no data —';
                emptyRow.appendChild(emptyCell);
                tbody.appendChild(emptyRow);
                return;
            }
            rows.forEach(function (user, index) {
                const tr = document.createElement('tr');
                const rank = document.createElement('td');
                rank.textContent = String(index + 1);      // место после сортировки (с 1)
                const score = document.createElement('td');
                score.textContent = String(user.high_score);
                const name = document.createElement('td');
                name.textContent = user.user_name;         // textContent => без HTML-инъекций
                tr.appendChild(rank);
                tr.appendChild(score);
                tr.appendChild(name);
                tbody.appendChild(tr);
            });
        }

        /* ---------- Приём данных из Unity (шина vuplex) ----------
           Сообщение может быть JSON-строкой или уже распарсенным объектом;
           поле называется event.data либо event.value (зависит от версии
           Vuplex) — обрабатываем оба варианта. Некорректные сообщения
           тихо игнорируются (console.debug). */
        function onLeaderboardMessage(event) {
            try {
                const raw = (event && event.data !== undefined && event.data !== null)
                    ? event.data
                    : (event ? event.value : undefined);
                const msg = (typeof raw === 'string') ? JSON.parse(raw) : raw;
                if (!msg || typeof msg !== 'object' ||
                    !msg.leaderboards || typeof msg.leaderboards !== 'object') {
                    return;
                }
                Object.keys(msg.leaderboards).forEach(function (key) {
                    const id = String(key).trim();                    // защита от ключей вида "mutagen "
                    if (LEADERBOARD_GAMES.indexOf(id) === -1) return; // неизвестные игры игнорируем
                    const entry = msg.leaderboards[key];
                    const users = (entry && Array.isArray(entry.users)) ? entry.users : [];
                    // count — информационное поле, опираемся на users.length.
                    LEADERBOARD_DATA[id] = users
                        .filter(function (u) { return u && typeof u === 'object'; })
                        .map(function (u) {
                            return {
                                high_score: Number(u.high_score) || 0,
                                user_name: (u.user_name === undefined || u.user_name === null)
                                    ? ''
                                    : String(u.user_name)
                            };
                        });
                });
                // Последнее сообщение побеждает: если таблицы уже построены —
                // сразу перерисовываем их (закрытый оверлей заполнится при открытии).
                if (leaderboardBuilt) {
                    LEADERBOARD_GAMES.forEach(renderLeaderboardRows);
                }
            } catch (e) {
                console.debug('[leaderboard] некорректное сообщение vuplex проигнорировано:', e);
            }
        }

        /* Подписка на сообщения шины: если window.vuplex уже есть (в т.ч. мок
           выше) — подписываемся сразу, иначе ждём vuplexready. Существующий
           слушатель vuplexready выше по коду не затрагивается. */
        function subscribeLeaderboardBus() {
            if (window.vuplex && typeof window.vuplex.addEventListener === 'function') {
                window.vuplex.addEventListener('message', onLeaderboardMessage);
            }
        }
        if (inVuplex()) {
            subscribeLeaderboardBus();
        } else {
            window.addEventListener('vuplexready', subscribeLeaderboardBus, { once: true });
        }

        /* ---------- README modal logic ----------
           Non-vuplex: load README.md, no language toggle (button stays hidden).
           Vuplex: load vuplex_RU.md by default; the 🔣 button switches
           between vuplex_RU.md and vuplex_EN.md.
           The file is chosen lazily at click time, because Vuplex may become
           known only after the 'vuplexready' event. Button visibility is
           purely CSS-driven (body.vuplex-mode), so applyVuplexMode() keeps
           it correct automatically. */
        const VUPLEX_READMES = { ru: './vuplex_RU.md', en: './vuplex_EN.md' };
        let currentReadmeLang = 'ru';          // 'ru' | 'en' — vuplex mode only
        const readmeCache = {};                // filename -> rendered HTML

        function openReadme() {
            // Decide which file to show at click time (vuplex may appear late).
            const file = inVuplex() ? VUPLEX_READMES[currentReadmeLang] : './README.md';
            return loadReadme(file);
        }

        function toggleReadmeLang() {
            currentReadmeLang = (currentReadmeLang === 'ru') ? 'en' : 'ru';
            loadReadme(VUPLEX_READMES[currentReadmeLang]);
        }

        async function loadReadme(file) {
            const modal = document.getElementById('readmeModal');
            const content = document.getElementById('readmeContent');
            modal.classList.add('open');

            if (readmeCache[file]) {
                content.innerHTML = readmeCache[file];
                return;
            }

            try {
                const res = await fetch(file, { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();

                let html;
                if (typeof marked !== 'undefined') {
                    html = marked.parse ? marked.parse(text) : marked(text);
                } else {
                    // Fallback: show raw markdown if the library failed to load
                    html = '<pre style="white-space:pre-wrap;">' + text + '</pre>';
                }
                content.innerHTML = html;
                readmeCache[file] = html;      // per-file cache, successful loads only
            } catch (e) {
                content.innerHTML =
                    '<p>Не удалось загрузить ' + file + '.</p>' +
                    '<p>Если вы открыли страницу локально через <code>file://</code>, ' +
                    'браузер блокирует загрузку файла. На GitHub Pages всё работает корректно.</p>' +
                    '<p style="color:#999;">Ошибка: ' + e.message + '</p>';
            }
        }

        function closeReadme() {
            document.getElementById('readmeModal').classList.remove('open');
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeReadme();
                closeLeaderboard();   // не открыт — early return, безопасно в любом режиме
            }
        });
    </script>
</body>
</html>
