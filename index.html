<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор игры</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            width: 100%;
            max-width: 720px;
            padding: clamp(20px, 5vw, 40px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: clamp(1.3em, 4vw, 1.9em);
            word-break: break-word;
        }
        .buttons {
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
        }

        /* ---------- Base button look ---------- */
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
        }

        /*
            Game buttons pick their own colors from CSS variables that are
            injected by JS (see GAMES below). This means there is NO need to
            write a separate .btn-xxx CSS rule for every new game.
        */
        .buttons button {
            flex: 1 1 200px;
            min-width: 0;
            background: var(--btn-color, #888);
        }

        /* Hover / tap feedback only on devices that actually hover (avoids
           "stuck hover" on touch screens). */
        @media (hover: hover) {
            .buttons button:hover {
                background: var(--btn-hover, var(--btn-color, #666));
                transform: scale(1.05);
                box-shadow: 0 5px 20px var(--btn-glow, rgba(0,0,0,0.5));
            }
        }

        /* ---------- Steam widget (kept responsive) ---------- */
        .steam-widget {
            width: 100%;
            max-width: 646px;
            margin: 0 auto;
        }
        .steam-widget iframe {
            display: block;
            width: 100%;
            max-width: 100%;
            height: 190px;
            border: 0;
        }
        .box-2 {
            margin-top: 14px;
            word-break: break-word;
        }

        /* ---------- Floating "i" (info) button ---------- */
        .info-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 46px;
            height: 46px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.7);
            font-size: 22px;
            font-weight: bold;
            font-style: italic;
            font-family: Georgia, 'Times New Roman', serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .info-button:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        /* ---------- README modal ---------- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 16px;
            max-width: 820px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            padding: clamp(18px, 5vw, 40px);
            box-sizing: border-box;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            width: auto;
            padding: 4px 12px;
            background: transparent;
            border: none;
            font-size: 30px;
            line-height: 1;
            color: #999;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #333;
            transform: none;
            box-shadow: none;
        }

        /* ---------- Rendered README styling ---------- */
        .readme {
            text-align: left;
            line-height: 1.6;
            color: #333;
        }
        .readme h1, .readme h2, .readme h3 {
            color: #333;
            margin-top: 1.2em;
        }
        .readme h1 { font-size: 1.8em; }
        .readme h3 { font-size: 1.2em; }
        .readme a {
            color: #667eea;
            word-break: break-word;
        }
        .readme img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .readme blockquote {
            border-left: 4px solid #667eea;
            margin: 12px 0;
            padding: 8px 16px;
            background: #f5f5fa;
            color: #555;
        }
        .readme code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
        }

        /* ============================================================
           MOBILE ADAPTATION (phones)
           - On phones only the games marked mobile:true stay visible.
           - Buttons become full-width, comfortable to tap.
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px;
                justify-content: flex-start;
            }
            .container {
                padding: 22px 16px;
            }
            h1 {
                margin-bottom: 18px;
            }
            /* Hide every game that is NOT phone-friendly */
            .buttons button[data-mobile="false"] {
                display: none;
            }
            .buttons {
                gap: 12px;
            }
            .buttons button {
                flex: 1 1 100%;
                width: 100%;
                padding: 16px 20px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating info button -->
    <button class="info-button" onclick="openReadme()" title="Инфо / README">i</button>

    <!-- README modal -->
    <div class="modal" id="readmeModal" onclick="if(event.target===this) closeReadme()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeReadme()" title="Закрыть">&times;</button>
            <div class="readme" id="readmeContent">
                <p>Загрузка…</p>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Select a game/Выберите игру</h1>

        <!-- Game buttons are generated automatically from the GAMES list below -->
        <div class="buttons" id="gameButtons"></div>

        <br/><br/>
        <div class="container">
            <div class="box-1 steam-widget">
                <iframe src="https://store.steampowered.com/widget/4799230/?t=please%20add%20my%20game%20to%20your%20wishlist%20%F0%9F%98%8D%E2%AD%90%20thank%20you!" frameborder="0" loading="lazy"></iframe>
            </div>
            <div class="box-2"><a style="color: #333;">contact with developer:</a> <a href="mailto:jispar@mail.ru">jispar@mail.ru</a>.</div>
        </div>
    </div>

    <!-- Markdown renderer + README loader -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        /* ============================================================
           СПИСОК ИГР  (единственное место, которое нужно править)
           ------------------------------------------------------------
           Чтобы добавить новую игру — просто скопируйте один блок { ... }
           и заполните поля. Больше НИЧЕГО менять не нужно: кнопка,
           цвет и логика мобильной видимости подхватятся автоматически.

             cls    — класс-«крючок» (на случай, если захотите стилизовать
                      конкретную игру вручную). Можно оставить ''.
             label  — текст кнопки (с эмодзи).
             href   — ссылка на игру.
             color  — основной цвет кнопки.
             hover  — цвет при наведении (необязательно).
             glow   — цвет свечения при наведении (необязательно).
             mobile — true  → показывать на телефоне;
                      false → скрыть на телефоне (по умолчанию).
           ============================================================ */
        const GAMES = [
            {
                cls: 'btn-domino',
                label: '🎲 Domino Ladder',
                href: './domino-ladder-index.html',
                color: '#f093fb',
                hover: '#e07cee',
                glow: 'rgba(240, 147, 251, 0.5)',
                mobile: false,
            },
            {
                cls: 'btn-password',
                label: '🔐 Password Game',
                href: './password-game-index.html',
                color: '#4facfe',
                hover: '#3a8fd6',
                glow: 'rgba(79, 172, 254, 0.5)',
                mobile: false,
            },
            {
                cls: 'btn-shittymaze',
                label: '🏠 ShittyMaze',
                href: 'https://prikalel.github.io/ShittyMaze/',
                color: '#cc7a00',
                hover: '#915700',
                glow: 'rgba(0, 0, 0, 0.5)',
                mobile: false,
            },
            {
                cls: 'btn-theygrow',
                label: '👤 Theygrow',
                href: 'https://prikalel.github.io/they-grow/',
                color: '#7a32ff',
                hover: '#2d0081',
                glow: 'rgba(0, 0, 0, 0.5)',
                mobile: false,
            },
            {
                cls: 'degustator',
                label: '🍔 Degustator',
                href: 'https://prikalel.github.io/degustator-on-x-7/',
                color: '#2a9400',
                hover: '#1a3f00',
                glow: 'rgba(179, 255, 47, 0.5)',
                mobile: true,
            },
            {
                cls: 'aang',
                label: '🔥 AangLegend',
                href: 'https://prikalel.github.io/AangLegend/',
                color: '#bd0d00',
                hover: '#570600',
                glow: 'rgba(255, 143, 135, 0.5)',
                mobile: true,
            },
            {
                cls: 'truba',
                label: '🚰 TRUBA',
                href: 'https://prikalel.gitlab.io/truba-build/',
                color: '#211715',
                hover: '#000000',
                glow: 'rgba(61, 10, 10, 0.5)',
                mobile: false,
            },
        ];

        /* Build the game buttons from the config above. */
        function renderGames() {
            const container = document.getElementById('gameButtons');
            if (!container) return;

            const frag = document.createDocumentFragment();
            GAMES.forEach(function (g) {
                const btn = document.createElement('button');
                if (g.cls) btn.className = g.cls;

                // Colors are injected as CSS variables -> no per-game CSS needed.
                btn.style.setProperty('--btn-color', g.color);
                btn.style.setProperty('--btn-hover', g.hover || g.color);
                btn.style.setProperty('--btn-glow', g.glow || 'rgba(0, 0, 0, 0.5)');

                // Phone-visibility flag drives the @media rule in <style>.
                btn.dataset.mobile = g.mobile ? 'true' : 'false';

                btn.textContent = g.label;
                btn.addEventListener('click', function () {
                    window.location.href = g.href;
                });
                frag.appendChild(btn);
            });
            container.appendChild(frag);
        }

        renderGames();

        /* ---------- README modal logic (unchanged) ---------- */
        let readmeLoaded = false;

        async function openReadme() {
            const modal = document.getElementById('readmeModal');
            const content = document.getElementById('readmeContent');
            modal.classList.add('open');

            if (readmeLoaded) return;

            try {
                const res = await fetch('./README.md', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();

                let html;
                if (typeof marked !== 'undefined') {
                    html = marked.parse ? marked.parse(text) : marked(text);
                } else {
                    // Fallback: show raw markdown if the library failed to load
                    html = '<pre style="white-space:pre-wrap;">' + text + '</pre>';
                }
                content.innerHTML = html;
                readmeLoaded = true;
            } catch (e) {
                content.innerHTML =
                    '<p>Не удалось загрузить README.md.</p>' +
                    '<p>Если вы открыли страницу локально через <code>file://</code>, ' +
                    'браузер блокирует загрузку файла. На GitHub Pages всё работает корректно.</p>' +
                    '<p style="color:#999;">Ошибка: ' + e.message + '</p>';
            }
        }

        function closeReadme() {
            document.getElementById('readmeModal').classList.remove('open');
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeReadme();
        });
    </script>
</body>
</html>
