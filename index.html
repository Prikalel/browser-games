<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор игры</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: white;
        }
        .btn-domino {
            background: #f093fb;
        }
        .btn-domino:hover {
            background: #e07cee;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(240, 147, 251, 0.5);
        }
        .btn-password {
            background: #4facfe;
        }
        .btn-password:hover {
            background: #3a8fd6;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.5);
        }
        .btn-shittymaze {
            background: #cc7a00;
        }
        .btn-shittymaze:hover {
            background: #915700;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }
        .btn-theygrow {
            background: #7a32ff;
        }
        .btn-theygrow:hover {
            background: #2d0081;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }
        .degustator {
            background: #2a9400;
        }
        .degustator:hover {
            background: #1a3f00;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(179, 255, 47, 0.5);
        }
        .aang {
            background: #bd0d00;
        }
        .aang:hover {
            background: #570600;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 143, 135, 0.5);
        }

        /* Floating "i" (info) button */
        .info-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 46px;
            height: 46px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.7);
            font-size: 22px;
            font-weight: bold;
            font-style: italic;
            font-family: Georgia, 'Times New Roman', serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .info-button:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        /* README modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 16px;
            max-width: 820px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            width: auto;
            padding: 4px 12px;
            background: transparent;
            border: none;
            font-size: 30px;
            line-height: 1;
            color: #999;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #333;
            transform: none;
            box-shadow: none;
        }

        /* Rendered README styling */
        .readme {
            text-align: left;
            line-height: 1.6;
            color: #333;
        }
        .readme h1, .readme h2, .readme h3 {
            color: #333;
            margin-top: 1.2em;
        }
        .readme h1 { font-size: 1.8em; }
        .readme h3 { font-size: 1.2em; }
        .readme a {
            color: #667eea;
            word-break: break-word;
        }
        .readme img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .readme blockquote {
            border-left: 4px solid #667eea;
            margin: 12px 0;
            padding: 8px 16px;
            background: #f5f5fa;
            color: #555;
        }
        .readme code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
        }
    </style>
</head>
<body>
    <!-- Floating info button -->
    <button class="info-button" onclick="openReadme()" title="Инфо / README">i</button>

    <!-- README modal -->
    <div class="modal" id="readmeModal" onclick="if(event.target===this) closeReadme()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeReadme()" title="Закрыть">&times;</button>
            <div class="readme" id="readmeContent">
                <p>Загрузка…</p>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Select a game/Выберите игру</h1>
        <div class="buttons">
            <button class="btn-domino" onclick="window.location.href='./domino-ladder-index.html'">
                🎲 Domino Ladder
            </button>
            <button class="btn-password" onclick="window.location.href='./password-game-index.html'">
                🔐 Password Game
            </button>
            <button class="btn-shittymaze" onclick="window.location.href='https://prikalel.github.io/ShittyMaze/'">
                🏠 ShittyMaze
            </button>
            <button class="btn-theygrow" onclick="window.location.href='https://prikalel.github.io/they-grow/'">
                👤 Theygrow
            </button>
            <button class="degustator" onclick="window.location.href='https://prikalel.github.io/degustator-on-x-7/'">
                🍔 Degustator
            </button>
            <button class="aang" onclick="window.location.href='https://prikalel.github.io/AangLegend/'">
                🔥 AangLegend
            </button>
        </div>

        <br/><br/>
        <div class="container">
            <div class="box-1"><iframe src="https://store.steampowered.com/widget/4799230/?t=please%20add%20my%20game%20to%20your%20wishlist%20%F0%9F%98%8D%E2%AD%90%20thank%20you!" frameborder="0" width="646" height="190"></iframe></div>
            <div class="box-2"><a style="color: #333;">contact with developer:</a> <a href="mailto:jispar@mail.ru">jispar@mail.ru</a>.</div>
        </div>
    </div>

    <!-- Markdown renderer + README loader -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let readmeLoaded = false;

        async function openReadme() {
            const modal = document.getElementById('readmeModal');
            const content = document.getElementById('readmeContent');
            modal.classList.add('open');

            if (readmeLoaded) return;

            try {
                const res = await fetch('./README.md', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();

                let html;
                if (typeof marked !== 'undefined') {
                    html = marked.parse ? marked.parse(text) : marked(text);
                } else {
                    // Fallback: show raw markdown if the library failed to load
                    html = '<pre style="white-space:pre-wrap;">' + text + '</pre>';
                }
                content.innerHTML = html;
                readmeLoaded = true;
            } catch (e) {
                content.innerHTML =
                    '<p>Не удалось загрузить README.md.</p>' +
                    '<p>Если вы открыли страницу локально через <code>file://</code>, ' +
                    'браузер блокирует загрузку файла. На GitHub Pages всё работает корректно.</p>' +
                    '<p style="color:#999;">Ошибка: ' + e.message + '</p>';
            }
        }

        function closeReadme() {
            document.getElementById('readmeModal').classList.remove('open');
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeReadme();
        });
    </script>
</body>
</html>
